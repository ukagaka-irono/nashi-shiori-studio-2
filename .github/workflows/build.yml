# 押すたびに、手元と同じテストを走らせます。
#
# 手元では `.\build.ps1 -Test` を打った人にしかテストが走りません。打ち忘れると、
# 壊れたまま進んでも誰も気づけないので、ここで必ず走るようにしておきます。
# 手順やテストの中身は docs/maintenance.md を見てください。
name: ビルドとテスト

on:
  push:
    branches: [main]
    tags: ['v*']          # 配るためのタグも、押した時点で確かめる
  pull_request:
  workflow_dispatch:      # 手で走らせたいとき

# 続けて push したら、古いほうは止める（順番待ちにならないように）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 既定は「読むだけ」。Release を作るジョブにだけ、書く力を渡します。
permissions:
  contents: read

jobs:
  # ビルドが要らない点検だけ、先に。1 分ほどで赤か緑か分かります。
  check:
    name: そろい点検（ビルド不要）
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: ブロックのそろい
        run: node tools\check-blocks.js

      - name: エディタ（整形とチェックタブ）
        run: node ui\test\editor.js

      - name: 画面のファイル（読みこみと呼び先）
        run: node ui\test\modules.js

  # 栞（32bit DLL）とスタジオ（64bit EXE）を作って、テストを通し、配る形にまとめる。
  build:
    name: ビルドとテスト
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # 落とすものの名前に入れます。1.0.4-alpha-a8c8356 のようになります。
      - name: 版と、押した番号を読む
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          "short=$('${{ github.sha }}'.Substring(0, 7))" >> $env:GITHUB_OUTPUT

      # MSVC も Windows SDK もランナーに入っています。WebView2 の SDK は
      # studio/third_party に置いてあるので、落としてくるものはありません。
      # -Release は「作り直す → テストする → 配る形にまとめる」まで一度にやります。
      - name: ビルドしてテストして、配る形にまとめる
        shell: pwsh
        run: |
          # テストの結果は日本語なので、UTF-8 で読めるようにしておく
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          .\build.ps1 -Release

      # 手元でビルドしなくても、ここから落として試せるように。
      # 中身は配る zip とまったく同じです（exe / README / CHANGELOG / LICENSE / docs）。
      # LICENSE を必ず添えるのは、同梱している WebView2 SDK が
      # 配るときに著作権表示を求めているためです。
      # 署名はしていないので、Windows に止められることがあります（README 参照）。
      #
      # ※ Actions の成果物は、GitHub にログインしていないと落とせません。
      #   ログイン無しで配りたいときは、v で始まるタグを押して Release にします。
      - name: エディタを残す
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nashi-studio-2-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short }}
          path: obj/release/nashi-studio-2-${{ steps.ver.outputs.version }}/
          retention-days: 30

      # 栞だけ欲しい人（自分でゴーストに入れる人）のために、別にしておきます。
      # エディタの exe にも同じものが入っているので、ふつうは要りません。
      - name: 栞だけも残す
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nashi-dll-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short }}
          path: shiori/dist/nashi.dll
          retention-days: 30

      # タグのときだけ。下の release ジョブに渡すためのもので、
      # 人が落とすものではありません（1 日で消えます）。
      - name: 配る zip を、次のジョブに渡す
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-zip
          path: dist/*.zip
          retention-days: 1

  # v で始まるタグを押したときだけ走ります。ここではビルドしません。
  # 上のジョブがテストを通した zip を、そのまま貼ります。
  # そうしておくと「配ったもの」と「テストを通したもの」が必ず同じになります。
  release:
    name: Release を下書きで作る
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write     # Release を作るのに要ります。このジョブにだけ与えます
    steps:
      - name: zip を受けとる
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip
          path: dist

      # わざと「下書き」で作ります。中身を見てから、GitHub の画面で
      # 「Publish release」を押してください。押すまでは誰にも見えません。
      # （v1.0.4-beta のように、あとで取り下げたくなることがあるためです）
      - name: 下書きを作る
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # checkout していないので、どこの話か教える
          # タグの名前は押した人が自由に付けられるので、スクリプトに直接はめこまず、
          # 環境変数として渡す（名前に ' や ; を入れてコマンドを足されないように）
          TAG: ${{ github.ref_name }}
        run: |
          # gh は「まだ無い」ときに 1 で終わります。それを失敗あつかいさせない
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = $env:TAG
          $zip = (Get-ChildItem dist\*.zip | Select-Object -First 1)
          if (-not $zip) { throw '配る zip が見つかりません。' }
          Write-Host "$tag に $($zip.Name) を貼ります"

          # v1.0.4-alpha のように「-」が付いていたら、まだ試し版あつかい
          $opt = @('--draft', '--title', $tag, '--generate-notes')
          if ($tag -match '-') { $opt += '--prerelease' }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # 公開ずみの Release の中身は、タグを押しなおしても差しかえない（下書きだけ）
            $draft = gh release view $tag --json isDraft --jq .isDraft
            if ($draft -ne 'true') { throw "$tag はもう公開されています。差しかえるなら、新しい版のタグを押してください。" }
            Write-Host "$tag はもうあるので、zip だけ入れ替えます"
            gh release upload $tag $zip.FullName --clobber
          } else {
            gh release create $tag $zip.FullName @opt
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release を作れませんでした。' }
          Write-Host "できました。GitHub の Releases で中身を見て、公開してください。"
